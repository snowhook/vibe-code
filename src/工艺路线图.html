<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工艺路线图 - 丝印高周波+暗影激光</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="450" y="30" text-anchor="middle" class="title">工艺路线图</text>
    <text x="450" y="50" text-anchor="middle" class="small">A部分：丝印+高周波 | B部分：暗影+激光 | 拼装成品</text>
    
    <!-- A部分区域 -->
    <rect x="50" y="80" width="380" height="180" class="zone" rx="8"/>
    <text x="240" y="100" text-anchor="middle" class="label" style="fill: var(--muted);">A部分（丝印+高周波）</text>
    
    <!-- A部分节点 -->
    <rect x="70" y="120" width="100" height="50" class="node input" rx="6"/>
    <text x="120" y="145" text-anchor="middle" class="label">开料</text>
    <text x="120" y="160" text-anchor="middle" class="small">片料/卷料</text>
    
    <rect x="200" y="120" width="100" height="50" class="node process" rx="6"/>
    <text x="250" y="145" text-anchor="middle" class="label">丝印</text>
    <text x="250" y="160" text-anchor="middle" class="small">水性油墨/油墨</text>
    
    <rect x="330" y="120" width="100" height="50" class="node process" rx="6"/>
    <text x="380" y="145" text-anchor="middle" class="label">高周波</text>
    <text x="380" y="160" text-anchor="middle" class="small">切章/盖胶</text>
    
    <!-- A部分箭头 -->
    <path d="M 170 145 L 200 145" class="edge" marker-end="url(#arrow)"/>
    <path d="M 300 145 L 330 145" class="edge" marker-end="url(#arrow)"/>
    
    <!-- B部分区域 -->
    <rect x="50" y="300" width="380" height="180" class="zone" rx="8"/>
    <text x="240" y="320" text-anchor="middle" class="label" style="fill: var(--muted);">B部分（暗影+激光）</text>
    
    <!-- B部分节点 -->
    <rect x="70" y="340" width="100" height="50" class="node input" rx="6"/>
    <text x="120" y="365" text-anchor="middle" class="label">开料</text>
    <text x="120" y="380" text-anchor="middle" class="small">片料/卷料</text>
    
    <rect x="200" y="340" width="100" height="50" class="node process" rx="6"/>
    <text x="250" y="365" text-anchor="middle" class="label">激光暗影</text>
    <text x="250" y="380" text-anchor="middle" class="small">短波机/大机</text>
    
    <rect x="330" y="340" width="100" height="50" class="node process" rx="6"/>
    <text x="380" y="365" text-anchor="middle" class="label">激光切割</text>
    <text x="380" y="380" text-anchor="middle" class="small">镭射/震动刀</text>
    
    <!-- B部分箭头 -->
    <path d="M 170 365 L 200 365" class="edge" marker-end="url(#arrow)"/>
    <path d="M 300 365 L 330 365" class="edge" marker-end="url(#arrow)"/>
    
    <!-- 拼装节点 -->
    <rect x="500" y="210" width="120" height="60" class="node storage" rx="6"/>
    <text x="560" y="235" text-anchor="middle" class="label">拼位</text>
    <text x="560" y="255" text-anchor="middle" class="small">A+B对位贴合</text>
    
    <!-- 挑废节点 -->
    <rect x="660" y="210" width="100" height="60" class="node neutral" rx="6"/>
    <text x="710" y="240" text-anchor="middle" class="label">挑废</text>
    <text x="710" y="255" text-anchor="middle" class="small">去除废料</text>
    
    <!-- 品检节点 -->
    <rect x="660" y="300" width="100" height="60" class="node neutral" rx="6"/>
    <text x="710" y="330" text-anchor="middle" class="label">品检</text>
    <text x="710" y="345" text-anchor="middle" class="small">人工/视觉</text>
    
    <!-- 包装节点 -->
    <rect x="660" y="390" width="100" height="60" class="node neutral" rx="6"/>
    <text x="710" y="420" text-anchor="middle" class="label">包装</text>
    <text x="710" y="435" text-anchor="middle" class="small">整版/单个</text>
    
    <!-- 连接箭头 -->
    <!-- A部分到拼位 -->
    <path d="M 430 145 L 500 230" class="edge" marker-end="url(#arrow)"/>
    <!-- B部分到拼位 -->
    <path d="M 430 365 L 500 250" class="edge" marker-end="url(#arrow)"/>
    <!-- 拼位到挑废 -->
    <path d="M 620 240 L 660 240" class="edge" marker-end="url(#arrow)"/>
    <!-- 挑废到品检 -->
    <path d="M 710 270 L 710 300" class="edge" marker-end="url(#arrow)"/>
    <!-- 品检到包装 -->
    <path d="M 710 360 L 710 390" class="edge" marker-end="url(#arrow)"/>
    
    <!-- 箭头标记 -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="var(--line)"/>
      </marker>
    </defs>
    
    <!-- 风险标注 -->
    <rect x="500" y="480" width="380" height="100" class="node risk" rx="6" opacity="0.3"/>
    <text x="690" y="500" text-anchor="middle" class="label" style="fill: var(--risk);">风险管控</text>
    <text x="510" y="520" class="small">• 升华：面料中/深色涤纶 + 浅色烫章时需防升华处理</text>
    <text x="510" y="540" class="small">• 溢胶：调整胶水厚度/改选胶水/胶水搭配布色</text>
    <text x="510" y="560" class="small">• 拼位偏差：确认间距≥合适尺寸，确认定位纸方案</text>
  </svg>
</main>
