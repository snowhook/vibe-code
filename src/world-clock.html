function getWeatherIcon(code){
if(code===0)return "☀️";
if(code>=1&&code<=3)return "⛅";
if(code>=45&&code<=48)return "🌫️";
if(code>=51&&code<=55)return "🌦️";
if(code>=56&&code<=57)return "❄️🌧️";
if(code>=61&&code<=65)return "🌧️";
if(code>=66&&code<=67)return "🌧️❄️";
if(code>=71&&code<=75)return "❄️";
if(code===77)return "❄️";
if(code>=80&&code<=82)return "☔";
if(code>=85&&code<=86)return "🌨️";
if(code===95)return "⛈️";
if(code>=96&&code<=99)return "⛈️🌨️";
return "🌤️";
}
var weatherCache={};
function fetchWeather(){
CITIES.forEach(function(c){
if(!selectedCities.has(c.name))return;
var key=c.name;
if(weatherCache[key]&&Date.now()-weatherCache[key].time<600000)return;
var url="https://api.open-meteo.com/v1/forecast?latitude="+c.lat+"&longitude="+c.lon+"&current_weather=true";
fetch(url).then(function(r){return r.json();}).then(function(d){
if(d.current_weather){
var t=d.current_weather.temperature;
var wc=d.current_weather.weathercode;
var icon=getWeatherIcon(wc);
weatherCache[key]={temp:t,icon:icon,time:Date.now()};
var e=mapCards[c.name];
if(e)e.inner.querySelector(".city-weather").textContent=icon+" "+t.toFixed(1)+"°C";
}
}).catch(function(){});
});
}
function updateClocks(){var now=new Date();CITIES.forEach(function(c){var e=mapCards[c.name];if(!e||!selectedCities.has(c.name))return;try{var ts=now.toLocaleTimeString("zh-CN",{timeZone:c.tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});var el=e.inner;var h=parseInt(ts.slice(0,2));el.className="city-card-inner"+(h>=6&&h<18?" day":" night")+(c.name==="北京"?" card-beijing":"");el.querySelector(".city-dot").className="city-dot "+el.className.slice(-4);el.querySelector(".hms").textContent=ts.slice(0,5);el.querySelector(".sec").textContent=":"+ts.slice(6);el.querySelector(".city-date").textContent=now.toLocaleDateString("zh-CN",{timeZone:c.tz,month:"short",day:"numeric",weekday:"short"});var off=getOffset(c.tz,now)/60;el.querySelector(".city-offset").textContent="UTC"+(off>=0?"+":"")+off.toFixed(1);}catch(e){}});requestAnimationFrame(function(){setTimeout(updateClocks,1000-Date.now()%1000+50);});}
function getOffset(tz,date){var p=date.toLocaleDateString("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).split("-");var tp=date.toLocaleTimeString("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).split(":");return(new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]),parseInt(tp[0]),parseInt(tp[1]),parseInt(tp[2]))-date)/60000;}
function updateCount(){countEl.textContent="显示 "+selectedCities.size+" 个城市";}
function renderRegionTabs(){regionTabs.innerHTML=["全部"].concat(REGIONS).map(function(r){return'<div class="region-tab '+(r===currentRegion?"active":"")+'" data-region="'+r+'">'+r+"</div>";}).join("");regionTabs.querySelectorAll(".region-tab").forEach(function(el){el.addEventListener("click",function(){currentRegion=el.dataset.region;renderRegionTabs();renderPanelList();});});}
function openPanel(){panelOpen=true;panelOverlay.classList.add("open");cityPanel.classList.add("open");document.body.style.overflow="hidden";renderPanelList();}
function closePanel(){panelOpen=false;panelOverlay.classList.remove("open");cityPanel.classList.remove("open");document.body.style.overflow="";}
btnToggle.addEventListener("click",openPanel);btnClose.addEventListener("click",closePanel);panelOverlay.addEventListener("click",closePanel);
btnSelectAll.addEventListener("click",function(){[].slice.call(panelList.querySelectorAll(".city-item")).map(function(el){return el.dataset.name;}).forEach(function(n){selectedCities.add(n);});syncMapVisibility();renderPanelList();updateCount();saveToLocalStorage();});
btnDeselectAll.addEventListener("click",function(){[].slice.call(panelList.querySelectorAll(".city-item")).map(function(el){return el.dataset.name;}).forEach(function(n){selectedCities.delete(n);});syncMapVisibility();renderPanelList();updateCount();saveToLocalStorage();});
btnReset.addEventListener("click",function(){selectedCities=new Set(DEFAULT_SELECTED);syncMapVisibility();renderPanelList();updateCount();saveToLocalStorage();});
searchInput.addEventListener("input",function(){currentFilter=searchInput.value;renderPanelList();});
function saveToLocalStorage(){try{localStorage.setItem("worldclock_selected",JSON.stringify(Array.from(selectedCities)));}catch(e){}}
function loadFromLocalStorage(){try{var r=localStorage.getItem("worldclock_selected");if(r){var a=JSON.parse(r);if(Array.isArray(a)&&a.length>0){selectedCities=new Set(a.filter(function(n){return CITIES.some(function(c){return c.name===n;});}));return;}}}catch(e){}selectedCities=new Set(DEFAULT_SELECTED);}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&panelOpen)closePanel();});
loadFromLocalStorage();syncMapVisibility();renderRegionTabs();updateCount();updateClocks();fetchWeather();setInterval(fetchWeather,600000);
</script>
</body>
</html>
