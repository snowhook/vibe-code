<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 新闻日报 — Top 10</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #0a0c12;
    color: #e0e0e0;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #0f141f 0%, #1a1f2e 100%);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
  }
  .header-left h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #fff;
  }
  .header-left h1 strong {
    font-weight: 600;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-left p {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    margin-top: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .update-info {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
  }
  .update-info .time {
    color: rgba(255,255,255,0.6);
  }
  .btn-refresh {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #ccc;
    padding: 8px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-refresh:hover {
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.15);
    color: #fff;
  }
  .btn-refresh.loading {
    pointer-events: none;
    opacity: 0.6;
  }
  .btn-refresh .icon {
    display: inline-block;
    transition: transform 0.3s;
  }
  .btn-refresh.loading .icon {
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .source-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .source-tag {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
  }

  .news-list { display: flex; flex-direction: column; gap: 12px; }

  .news-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 18px 22px;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
    position: relative;
  }
  .news-item:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
    transform: translateX(4px);
  }

  .news-rank {
    position: absolute;
    left: -8px;
    top: 18px;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: linear-gradient(135deg, #60a5fa, #3b82f6);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .news-rank.top3 {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
  }

  .news-source {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .news-source .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }
  .news-title {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .news-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-meta {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    font-size: 11px;
    color: rgba(255,255,255,0.25);
  }

  /* Loading / Error states */
  .loading-state, .error-state, .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: rgba(255,255,255,0.3);
  }
  .loading-state .spinner {
    width: 40px; height: 40px;
    border: 2px solid rgba(255,255,255,0.06);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  .error-state .err-icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .error-state .err-detail {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    margin-top: 8px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    word-break: break-all;
  }

  @media (max-width: 600px) {
    .header { padding: 16px; }
    .header-left h1 { font-size: 18px; }
    .news-item { padding: 14px 16px; }
    .news-title { font-size: 14px; }
    .news-desc { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>🤖 <strong>AI 新闻日报</strong></h1>
    <p>每日精选 · 10条权威AI资讯</p>
  </div>
  <div class="header-right">
    <div class="update-info">
      更新于 <span class="time" id="updateTime">--</span>
      <span id="autoStatus"> · 自动刷新中</span>
    </div>
    <button class="btn-refresh" id="btnRefresh" onclick="refreshNow()">
      <span class="icon">↻</span> 刷新
    </button>
  </div>
</div>

<div class="container">
  <div class="source-bar" id="sourceBar"></div>
  <div id="newsContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>正在获取AI新闻…</div>
    </div>
  </div>
</div>

<script>
// ── AI 新闻 RSS 源 ──────────────────────────────────────────────────────
const SOURCES = [
  { name: '量子位',  label: '量子位',  url: 'https://www.qbitai.com/feed' },
  { name: '36氪',    label: '36氪',    url: 'https://36kr.com/feed' },
  { name: '钛媒体',  label: '钛媒体',  url: 'https://www.tmtpost.com/rss' },
  { name: 'arXiv cs.AI', label: 'arXiv', url: 'https://rss.arxiv.org/rss/cs.AI' },
];

const CORS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';

let allArticles = [];
let isLoading = false;
let autoTimer = null;

// ── DOM refs ──
const newsContent = document.getElementById('newsContent');
const sourceBar   = document.getElementById('sourceBar');
const updateTime  = document.getElementById('updateTime');
const btnRefresh  = document.getElementById('btnRefresh');
const autoStatus  = document.getElementById('autoStatus');

// ── Init ──
renderSourceBar();

// Try loading from cache first, then fetch from RSS in background
loadFromCache().then(cached => {
  if (!cached) {
    // No cache, fetch directly
    fetchAllNews();
  } else {
    // Cache loaded, still fetch in background for fresh data
    setTimeout(() => fetchAllNews(true), 500);
  }
});

// Auto-refresh every 10 minutes
autoTimer = setInterval(() => fetchAllNews(), 10 * 60 * 1000);

// ── Render source tags ──
function renderSourceBar() {
  sourceBar.innerHTML = SOURCES.map(s => `<span class="source-tag">${s.label}</span>`).join('');
}

// Map cache source names (English) to display names
const SOURCE_LABEL_MAP = {
  'QbitAI': '量子位',
  '36Kr': '36氪',
  'TMTpost': '钛媒体',
  'arXiv cs.AI': 'arXiv',
};

// ── Load from local cache JSON ──
async function loadFromCache() {
  try {
    const res = await fetch('news-cache.json', { signal: AbortSignal.timeout(5000) });
    if (!res.ok) return false;
    const data = await res.json();
    if (data.articles && data.articles.length > 0) {
      allArticles = data.articles;
      renderNews(allArticles.slice(0, 10));
      updateTime.textContent = formatCacheTime(data.fetchedAt);
      autoStatus.textContent = ' · 缓存数据 · 后台刷新中';
      return true;
    }
    return false;
  } catch {
    return false;
  }
}

function formatCacheTime(timeStr) {
  if (!timeStr) return '--';
  try { return new Date(timeStr).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
  catch { return timeStr; }
}

// ── Fetch all RSS feeds ──
async function fetchAllNews(background) {
  if (isLoading) return;
  isLoading = true;
  btnRefresh.classList.add('loading');
  btnRefresh.querySelector('.icon').textContent = '↻';

  if (!background) {
    newsContent.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>正在获取AI新闻…</div></div>`;
  }

  const promises = SOURCES.map(src => fetchFeed(src).catch(() => null));
  const results = await Promise.all(promises);

  // Merge & deduplicate
  const seen = new Set();
  allArticles = [];
  results.forEach((result, idx) => {
    if (!result) return;
    result.items.forEach(item => {
      // Dedup by title
      const key = (item.title || '').trim().toLowerCase();
      if (!key || seen.has(key)) return;
      seen.add(key);
      allArticles.push({
        title: item.title,
        desc:  stripHtml(item.description || ''),
        link:  item.link || '',
        date:  item.pubDate || item.pub_date || '',
        source: SOURCES[idx].name,
        author: item.author || '',
      });
    });
  });

  // Sort by date (newest first), take top 10
  allArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
  const top10 = allArticles.slice(0, 10);

  if (top10.length === 0) {
    newsContent.innerHTML = `
      <div class="error-state">
        <div class="err-icon">😕</div>
        <div>暂无新闻，请稍后重试</div>
        <div class="err-detail">RSS 源可能暂时不可用</div>
      </div>`;
  } else {
    renderNews(top10);
  }

  const now = new Date();
  updateTime.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  isLoading = false;
  btnRefresh.classList.remove('loading');
  btnRefresh.querySelector('.icon').textContent = '↻';
}

// ── Fetch single RSS feed ──
async function fetchFeed(source) {
  const encoded = encodeURIComponent(source.url);
  const url = CORS_PROXY + encoded;
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  const data = await res.json();
  if (data.status !== 'ok') throw new Error('Bad response: ' + data.status);
  return data;
}

// ── Render news items ──
function displaySource(name) {
  return SOURCE_LABEL_MAP[name] || name;
}

function renderNews(articles) {
  const rankEmojis = ['🥇', '🥈', '🥉'];

  newsContent.innerHTML = `<div class="news-list">${articles.map((item, i) => {
    const rank = i + 1;
    const displayRank = rank <= 3 ? rankEmojis[i] : `#${rank}`;
    const isTop3 = rank <= 3;
    const dateStr = formatDate(item.date);
    return `
      <a class="news-item" href="${item.link}" target="_blank" rel="noopener">
        <div class="news-rank ${isTop3 ? 'top3' : ''}">${displayRank}</div>
        <div class="news-source">
          ${displaySource(item.source)}
          <span class="dot"></span>
          ${dateStr}
        </div>
        <div class="news-title">${escapeHtml(item.title)}</div>
        ${item.desc ? `<div class="news-desc">${escapeHtml(truncate(item.desc, 150))}</div>` : ''}
        <div class="news-meta">
          ${item.author ? `作者: ${escapeHtml(item.author)}` : ''}
        </div>
      </a>
    `;
  }).join('')}</div>`;
}

// ── Manual refresh ──
function refreshNow() {
  fetchAllNews();
  // Reset auto-timer
  clearInterval(autoTimer);
  autoTimer = setInterval(() => fetchAllNews(), 10 * 60 * 1000);
}

// ── Utilities ──
function stripHtml(str) {
  return str.replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function truncate(str, max) {
  return str.length > max ? str.slice(0, max) + '…' : str;
}
function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
    if (diff < 172800) return '昨天';
    return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
  } catch { return dateStr; }
}
</script>
</body>
</html>
