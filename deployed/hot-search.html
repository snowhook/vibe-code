<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全网热搜榜</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2333; --border:#262d3d;
    --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff;
    --gold:#f0b90b; --silver:#c0c8d4; --bronze:#cd7f32;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; padding:24px 16px 60px;
  }
  .wrap{max-width:1200px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  h1{font-size:26px;font-weight:700;letter-spacing:1px}
  h1 span{color:var(--accent)}
  .meta{color:var(--dim);font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{
    background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:wait}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .tab{
    background:var(--card);border:1px solid var(--border);color:var(--dim);
    border-radius:20px;padding:7px 18px;font-size:14px;cursor:pointer;transition:.15s;
  }
  .tab:hover{color:var(--text);border-color:#3d4658}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{
    display:flex;gap:14px;align-items:center;padding:11px 16px;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    text-decoration:none;color:var(--text);transition:.15s;
  }
  .item:hover{border-color:var(--accent);background:var(--card2);transform:translateX(2px)}
  .rank{
    width:30px;height:30px;flex-shrink:0;border-radius:8px;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:14px;
    background:var(--card2);color:var(--dim);font-variant-numeric:tabular-nums;
  }
  .rank.r1{background:linear-gradient(135deg,#f0b90b,#ffd700);color:#0d1117}
  .rank.r2{background:linear-gradient(135deg,#9aa4b2,#c0c8d4);color:#0d1117}
  .rank.r3{background:linear-gradient(135deg,#a9713c,#cd7f32);color:#fff}
  .title{flex:1;font-size:14.5px;line-height:1.45}
  .hot{font-size:12px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .empty{color:var(--dim);text-align:center;padding:40px;font-size:14px}
  .refresh-state{color:var(--accent);font-size:12px}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:30px;line-height:1.8}
  .item .tag{font-size:11px;color:var(--dim);border:1px solid var(--border);padding:1px 8px;border-radius:10px;white-space:nowrap}
  @media(max-width:640px){
    h1{font-size:22px}
    .item{padding:10px 12px}
    .hot{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>全网热搜榜 <span>&#8226;</span> 实时热点</h1>
    <div class="meta">
      <span id="today"></span>
      <span id="updateTime" class="refresh-state"></span>
      <button class="btn" id="refreshBtn">&#8635; 刷新</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="list" class="list"><div class="empty">正在加载热搜&#8230;</div></div>

  <footer>
    数据来源:60s API (https://60s.viki.moe) &#8226; 微博 / 抖音 / 知乎 / 头条 实时热搜<br>
    打开页面即自动刷新,每 10 分钟自动更新 &#8226; 点击条目跳转原平台查看详情
  </footer>
</div>

<script>
var PLATFORMS = [
  {key:"weibo",   name:"&#24494;&#21338;",   api:"https://60s.viki.moe/v2/weibo",   color:"#ff8200"},
  {key:"douyin",  name:"&#25238;&#38899;",   api:"https://60s.viki.moe/v2/douyin",  color:"#161823"},
  {key:"zhihu",   name:"&#30693;&#20046;",   api:"https://60s.viki.moe/v2/zhihu",   color:"#0084ff"},
  {key:"toutiao", name:"&#20170;&#26085;&#22836;&#26465;", api:"https://60s.viki.moe/v2/toutiao", color:"#f04142"}
];
var CACHE_KEY = "hotsearch_cache_v1";
var CACHE_TTL = 10 * 60 * 1000;
var activeTab = "weibo";
var cachedData = null;

/* 读取缓存(打开时先显示,再后台刷新) */
function readCache(){
  try{
    var c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if(c && c.ts && (Date.now() - c.ts < CACHE_TTL)) return c.data;
  }catch(e){}
  return null;
}
function writeCache(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), data: data})); }catch(e){}
}

function fmtHot(v){
  if(v === undefined || v === null || v === "") return "";
  var n = parseFloat(String(v).replace(/[^\d.]/g,""));
  if(isNaN(n)) return String(v);
  if(n >= 100000000) return (n/100000000).toFixed(1) + "&#20159;";
  if(n >= 10000) return (n/10000).toFixed(1) + "&#19975;";
  return String(n);
}

function renderTabs(){
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  PLATFORMS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "tab" + (p.key === activeTab ? " active" : "");
    b.innerHTML = p.name;
    b.onclick = function(){
      activeTab = p.key;
      renderTabs();
      var data = cachedData ? cachedData[p.key] : null;
      if(data) renderList(p.key, data);
      else { document.getElementById("list").innerHTML = '<div class="empty">正在加载 ' + p.name + ' 热搜&#8230;</div>'; fetchOne(p.key); }
    };
    tabs.appendChild(b);
  });
}

function renderList(key, items){
  var listEl = document.getElementById("list");
  if(!items || !items.length){
    listEl.innerHTML = '<div class="empty">该平台热搜暂时无法获取,请稍后刷新</div>';
    return;
  }
  listEl.innerHTML = "";
  items.forEach(function(it, i){
    var a = document.createElement("a");
    a.className = "item";
    a.href = it.link;
    a.target = "_blank";
    a.rel = "noopener";
    var rankCls = i === 0 ? " r1" : (i === 1 ? " r2" : (i === 2 ? " r3" : ""));
    var rank = document.createElement("span");
    rank.className = "rank" + rankCls;
    rank.textContent = i + 1;
    var title = document.createElement("span");
    title.className = "title";
    title.textContent = it.title;
    var hot = document.createElement("span");
    hot.className = "hot";
    var hv = fmtHot(it.hot_value !== undefined ? it.hot_value : it.hot_value_desc);
    hot.innerHTML = hv ? "&#128293; " + hv : "";
    a.appendChild(rank);
    a.appendChild(title);
    a.appendChild(hot);
    listEl.appendChild(a);
  });
}

function fetchAll(){
  var listEl = document.getElementById("list");
  listEl.innerHTML = '<div class="empty">正在加载热搜&#8230;</div>';
  var tasks = PLATFORMS.map(function(p){
    return fetch(p.api)
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.code !== 200 || !j.data) return [];
        return j.data;
      }).catch(function(){ return []; });
  });
  Promise.all(tasks).then(function(results){
    var data = {};
    PLATFORMS.forEach(function(p, i){ data[p.key] = results[i]; });
    cachedData = data;
    writeCache(data);
    renderList(activeTab, data[activeTab]);
    setUpdateTime();
    var emptyTabs = PLATFORMS.filter(function(p){ return !data[p.key].length; }).map(function(p){ return p.name; });
    if(emptyTabs.length) console.log("以下平台热搜获取失败:", emptyTabs.join(","));
  });
}

function fetchOne(key){
  var p = PLATFORMS.filter(function(x){ return x.key === key; })[0];
  fetch(p.api)
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j.code !== 200 || !j.data) return;
      if(!cachedData) cachedData = {};
      cachedData[key] = j.data;
      writeCache(cachedData);
      if(activeTab === key) renderList(key, j.data);
    }).catch(function(){});
}

function fmtDate(){
  var d = new Date();
  var week = ["日","一","二","三","四","五","六"][d.getDay()];
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 星期" + week;
}
function setUpdateTime(){
  var d = new Date();
  document.getElementById("updateTime").textContent =
    "更新于 " + ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2) + ":" + ("0"+d.getSeconds()).slice(-2);
}

document.getElementById("refreshBtn").addEventListener("click", function(){
  var btn = this;
  btn.disabled = true;
  btn.innerHTML = "刷新中&#8230;";
  fetchAll();
  setTimeout(function(){ btn.disabled = false; btn.innerHTML = "&#8635; 刷新"; }, 800);
});

document.getElementById("today").textContent = fmtDate();
renderTabs();

/* 打开页面:先显示缓存,同时强制刷新最新数据 */
cachedData = readCache();
if(cachedData && cachedData[activeTab]) renderList(activeTab, cachedData[activeTab]);
fetchAll();
setInterval(fetchAll, 10 * 60 * 1000);  // 每10分钟自动刷新
</script>
</body>
</html>
